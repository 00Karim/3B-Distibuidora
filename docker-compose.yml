version: "3.9"

services:
    mongodb:
        image: mongo:5
        container_name: mongo_container
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

    backend:
        build: ./backend
        container_name: backend_container
        restart: always
        ports:
            - "4000:4000"
        depends_on:
            - mongodb
        environment:
            - NODE_ENV=development
            - PORT=4000
            - MONGO_URI=mongodb://mongo_container:27017/3B-Distribuidora
            - CORS_ORIGIN=http://localhost:5173

    frontend:
        build: ./frontend
        container_name: frontend_container
        restart: always
        ports:
            - "5173:3000"
        depends_on:
            - backend

volumes:
    mongo_data:
